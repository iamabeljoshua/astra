name: TEMP flake lab 2
on: pull_request
permissions:
  contents: read
jobs:
  typed-gate-on-2-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1384e8af726500261058f99f4cfe9d6b4b8df49d
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: pnpm install --frozen-lockfile
      - name: Sample the flood test beside the whole agent suite
        working-directory: apps/agent
        run: |
          lscpu | grep 'Model name'; nproc
          cat > test/zz-flood.test.ts <<'TS'
          import { appendFileSync } from 'node:fs';
          import { it } from 'vitest';
          import { createTypedGate } from '../src/live/typed-gate.ts';
          const delay = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));
          it('samples the flood', async () => {
            for (let round = 0; round < 40; round += 1) {
              const released: string[] = [];
              const gate = createTypedGate({ getNowMs: () => performance.now(), onRelease: (text) => released.push(text), onHeld: () => undefined, limits: { burst: 3, refillEveryMs: 20 } });
              for (let index = 0; index < 100; index += 1) {
                gate.offer(`message ${index}`);
                await delay(2);
              }
              await delay(30);
              appendFileSync(process.env.FLOOD_FILE as string, `${released.length}\n`);
              gate.close();
            }
          }, 120000);
          TS
          once() {
            label=$1; workers=$2
            export FLOOD_FILE=/tmp/flood-$label.txt
            s=$(date +%s); pnpm exec vitest run --maxWorkers=$workers > "/tmp/$label.log" 2>&1; c=$?; e=$(date +%s)
            echo "LAB $label workers=$workers exit=$c secs=$((e-s)) flood counts: $(sort -n "$FLOOD_FILE" | uniq -c | awk '{printf "%sx%s ", $2, $1}')"
            [ "$c" = 0 ] || sed 's/\x1b\[[0-9;]*m//g' "/tmp/$label.log" | grep -E 'FAIL|AssertionError' | head -12
          }
          once w3-solo 3
          node -e 'for(;;){}' & hog1=$!
          node -e 'for(;;){}' & hog2=$!
          once w3-hogs 3
          once w1-hogs 1
          kill "$hog1" "$hog2"
