name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job has its own 2 threads and its own limit, and they run at once, so an answer still comes within the limit of its start.
  typecheck-and-web:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # A pnpm filter brings the root back in, and its test script would rerun every package.
      - name: Run the tests of the packages that are not an app with its own step
        background: true
        run: pnpm -r --no-bail --filter '!astra' --filter '!@astra/api' --filter '!@astra/agent' --filter '!@astra/web' test
      - run: pnpm typecheck
      - name: Run the web tests on both threads
        run: pnpm --filter @astra/web test --maxWorkers=2
      - name: Fail if the other packages' tests failed
        wait-all:

  # Merges read this one status. A job that was cancelled at its limit is not a success, so this fails too.
  checks:
    needs: [typecheck-and-web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail unless every job succeeded
        run: test "${{ needs.typecheck-and-web.result }}" = success && test "${{ needs.api-and-agent.result }}" = success
