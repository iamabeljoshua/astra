name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium --no-shell
      - run: pnpm verify start && pnpm verify doctor; pnpm verify stop
      - run: pnpm verify start && pnpm verify stop
      - run: sed -i '/rewrite:\ (path)/d' apps/web/vite.config.ts && git diff --stat
      - run: pnpm verify start && pnpm verify stop
