name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POSTGRES_TAG: 17.6.1.075
    steps:
      - uses: actions/checkout@v7
      - name: DIAG start the sampler
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz'; free -m; df -h / /mnt 2>/dev/null
          docker version --format 'docker {{.Server.Version}}'; which unpigz pigz zstd || true
          docker info 2>/dev/null | grep -E 'Storage Driver|Docker Root|driver-type' || true
          nohup sh -c 'vmstat -n -t 1 > /tmp/vmstat.log' > /dev/null 2>&1 &
          nohup sh -c 'top -b -d 5 -w 110 | grep --line-buffered -A7 "^top -" > /tmp/top.log' > /dev/null 2>&1 &
      # Unpacking this image takes half the time in memory, and starting now overlaps it with the steps below.
      # ghcr.io serves the same digest as the CLI's default registry, which has rate limited runners.
      # The CLI still picks the image that runs. A different tag adds a second image to this 6 GB disk, which may fill it, so a later step fails on a mismatch.
      - name: Start pulling the Postgres image
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /etc/docker /dockerdata
          sudo mount -t tmpfs -o size=6g tmpfs /dockerdata
          echo '{"data-root":"/dockerdata"}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl start docker
          nohup sh -c 'date +"pull-start %T"; docker pull "ghcr.io/supabase/postgres:$POSTGRES_TAG" | while IFS= read -r line; do echo "$(date +%T) $line"; done; date +"pull-end %T"' > /tmp/pull.log 2>&1 &
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail if the early pull is not the image that the Supabase CLI uses
        run: |
          cli_tag=$(pnpm exec supabase services | awk '$1 == "supabase/postgres" { print $3 }')
          if [ "$cli_tag" != "$POSTGRES_TAG" ]; then
            echo "::error file=.github/workflows/ci.yml::ci.yml pulls Postgres $POSTGRES_TAG, but the pinned Supabase CLI uses ${cli_tag:-an unknown tag}. Set POSTGRES_TAG to the tag that the CLI uses."
            exit 1
          fi
      - run: pnpm api:types
      - name: Fail if the generated API types are out of date
        run: |
          git diff --exit-code packages/contracts/src/api.generated.ts || {
            echo "::error file=packages/contracts/src/api.generated.ts::The generated API types are out of date. Run pnpm api:types and commit the result."
            exit 1
          }
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run the tests that need no database
        background: true
        run: pnpm -r --no-bail --filter '!astra' --filter '!@astra/api' test
      - name: Start Postgres on the image that the pinned Supabase CLI uses locally
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: pnpm exec supabase db start
      - name: Build a fresh database from the migrations and seed it
        run: pnpm db:migrate && pnpm db:seed
      - name: Build the web app, which fails if a development account reaches any file in the output
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
        run: pnpm --filter @astra/web build
      - name: Start and stop the real app
        background: true
        run: pnpm verify start && pnpm verify stop
      - name: Run the API tests
        run: pnpm --filter @astra/api test
      - name: Fail if a check that ran alongside the others failed
        wait-all:
      - name: DIAG print the trace
        if: always()
        run: |
          echo "== pull"; grep -E 'pull-start|pull-end' /tmp/pull.log; grep 'Pull complete' /tmp/pull.log | sed -n '1p;$p'
          echo "== vmstat"; cat /tmp/vmstat.log
      - name: DIAG measure the image options
        if: always()
        run: |
          set +e
          image="ghcr.io/supabase/postgres:$POSTGRES_TAG"
          stamp() { echo "STAMP $(date +%T) $*"; }
          pkill top
          docker ps -aq | xargs -r docker rm -f > /dev/null
          sudo mkdir -p /tmp/docker-tmp; sudo systemctl set-environment DOCKER_TMPDIR=/tmp/docker-tmp; sudo systemctl restart docker
          stamp save-start; docker save "$image" -o /tmp/pg.tar; stamp save-end; ls -l /tmp/pg.tar
          stamp zstd-start; zstd -T0 -3 -q /tmp/pg.tar -o /tmp/pg.tar.zst; stamp zstd-end; ls -l /tmp/pg.tar.zst
          docker rmi -f "$image" > /dev/null; docker image prune -af > /dev/null; free -m; sleep 3
          stamp load-start; docker load -q -i /tmp/pg.tar; stamp load-end; free -m; sleep 3
          docker rmi -f "$image" > /dev/null; docker image prune -af > /dev/null; rm -f /tmp/pg.tar
          sudo systemctl unset-environment DOCKER_TMPDIR; sudo systemctl restart docker; sleep 3
          stamp idle-pull-start; docker pull -q "$image"; stamp idle-pull-end; sleep 3
          sudo systemctl stop docker docker.socket
          stamp root-tar-start; sudo tar --xattrs --xattrs-include='trusted.*' -C /dockerdata -cf - . | zstd -T0 -3 -q -o /tmp/root.tar.zst; stamp root-tar-end; ls -l /tmp/root.tar.zst
          sudo find /dockerdata -mindepth 1 -delete; sleep 3
          stamp root-untar-start; zstd -dc /tmp/root.tar.zst | sudo tar --xattrs --xattrs-include='trusted.*' -xpf - -C /dockerdata; stamp root-untar-end; sleep 3
          sudo systemctl start docker; docker images
          docker run --rm --entrypoint postgres "$image" --version
          stamp end
          pkill vmstat
          echo "== vmstat after"; awk -v from="$(grep -m1 -o 'x' /dev/null)" '1' /tmp/vmstat.log | tail -n 420
