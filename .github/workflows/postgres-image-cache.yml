name: Postgres image cache

# The daily run replaces an entry that a new Docker version or 7 idle days have retired.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/postgres-image-cache.yml
      - .github/scripts/postgres-image.sh
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/postgres-image-cache.yml
      - .github/scripts/postgres-image.sh
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: postgres-image
        run: .github/scripts/postgres-image.sh key >> "$GITHUB_OUTPUT"
      - id: lookup
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-image.tar.zst
          key: ${{ steps.postgres-image.outputs.key }}
          lookup-only: true
      - name: Pull the image, archive it, and prove that the archive restores
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          .github/scripts/postgres-image.sh start-docker
          .github/scripts/postgres-image.sh archive
          .github/scripts/postgres-image.sh prove
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-image.tar.zst
          key: ${{ steps.postgres-image.outputs.key }}
