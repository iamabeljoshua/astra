name: Experiment
on: pull_request
permissions:
  contents: read
env:
  ECR_IMAGE: public.ecr.aws/supabase/postgres:17.6.1.075
  GHCR_IMAGE: ghcr.io/supabase/postgres:17.6.1.075
  CACHE_KEY: experiment-postgres-image-2
jobs:
  cache-then-load:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        sample: [1, 2]
    steps:
      - name: Confirm the store has no such image
        run: docker system df && docker images
      - name: Restore from the Actions cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/image.tar
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: docker load
        run: docker load -q -i /tmp/image.tar
      - name: Confirm the image runs
        run: docker run --rm "$ECR_IMAGE" postgres --version && docker system df
  cold-pull-ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        sample: [1, 2]
    steps:
      - name: Cold pull from GHCR
        run: docker pull -q "$GHCR_IMAGE"
      - name: Confirm the image runs
        run: docker run --rm "$GHCR_IMAGE" postgres --version && docker system df
  cold-pull-ecr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Cold pull from ECR
        run: |
          for attempt in 1 2 3 4 5 6; do
            docker pull -q "$ECR_IMAGE" && { echo "pulled on attempt $attempt"; exit 0; }
            sleep 10
          done
          exit 1
      - name: Confirm the image runs
        run: docker run --rm "$ECR_IMAGE" postgres --version
  fewer-disk-flushes-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remount the root disk with fewer flushes
        run: sudo mount -o remount,noatime,nobarrier,commit=300 / && mount | grep ' / '
      - name: Cold pull from GHCR
        run: docker pull -q "$GHCR_IMAGE"
      - name: Confirm the image runs
        run: docker run --rm "$GHCR_IMAGE" postgres --version
  fewer-disk-flushes-load:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remount the root disk with fewer flushes
        run: sudo mount -o remount,noatime,nobarrier,commit=300 / && mount | grep ' / '
      - name: Restore from the Actions cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/image.tar
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true
      - name: docker load
        run: docker load -q -i /tmp/image.tar
      - name: Confirm the image runs
        run: docker run --rm "$ECR_IMAGE" postgres --version
