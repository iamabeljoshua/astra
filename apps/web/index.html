<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A scene's sandbox can still navigate its own frame, and this stops that request before it leaves. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <script>
      // Runs before first paint so a saved dark theme never flashes light.
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {
        // Blocked storage only loses the saved choice.
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/theme/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
